name: Build packages

# Reusable: builds, checks and smoke-tests the five packages from the upstream tag pinned in UPSTREAM.
# Called by ci.yml (every push and pull request) and release.yml (tags). Uploads one artifact per RID.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # Linux packages are built on Ubuntu 22.04 (glibc 2.35) so they run on that and newer systems.
  # GitHub's arm64 Linux runners are free for public repositories only; a private repository cross-builds
  # linux-arm64 on x64 (rhwp with the aarch64 cross toolchain, .NET publish is a cross publish by design) and runs the
  # smoke test in an arm64 container under QEMU. A public repository uses the native arm64 runner.
  linux:
    name: ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64]
    runs-on: ${{ (matrix.rid == 'linux-arm64' && github.event.repository.private == false) && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}
    timeout-minutes: 90
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Fetch pinned upstream source
        run: python scripts/fetch_upstream.py

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: .upstream/Filee/global.json

      - name: Toolchain for rhwp
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config git ${{ matrix.rid == 'linux-arm64' && github.event.repository.private && 'gcc-aarch64-linux-gnu' || '' }}
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Build rhwp from source
        run: python scripts/build_rhwp_linux.py --rid ${{ matrix.rid }} --output "$RUNNER_TEMP/rhwp" --work "$RUNNER_TEMP/rhwp-work"

      - name: Check rhwp against glibc 2.35
        run: python .upstream/Filee/build/check-elf-glibc.py --max 2.35 --needed "$RUNNER_TEMP/rhwp"

      - name: Build package
        run: python scripts/build_package.py --rid ${{ matrix.rid }} --rhwp-dir "$RUNNER_TEMP/rhwp"

      - name: Check glibc requirements of every ELF file
        run: |
          mkdir -p "$RUNNER_TEMP/unpacked"
          tar -xzf dist/filee-cli-*-${{ matrix.rid }}.tar.gz -C "$RUNNER_TEMP/unpacked"
          python .upstream/Filee/build/check-elf-glibc.py --max 2.35 "$RUNNER_TEMP/unpacked"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: ${{ matrix.rid == 'linux-arm64' && github.event.repository.private }}
        with:
          platforms: arm64

      # A bare Ubuntu 22.04 container with only the runtime libraries a user installs (see the package README).
      - name: Smoke test on a clean Ubuntu 22.04
        run: |
          set -euo pipefail
          platform=${{ matrix.rid == 'linux-arm64' && 'linux/arm64' || 'linux/amd64' }}
          docker run --rm --platform "$platform" -v "$PWD:/repo" -w /repo ubuntu:22.04 bash -euxo pipefail -c '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              ca-certificates libc6 libgcc-s1 libicu70 libssl3 libstdc++6 tzdata zlib1g python3 fonts-noto-cjk
            python3 scripts/smoke_test.py dist/filee-cli-*-${{ matrix.rid }}.tar.gz
          '

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.rid }}
          path: |
            dist/filee-cli-*-${{ matrix.rid }}.tar.gz
            dist/filee-cli-*-${{ matrix.rid }}.files.txt
          if-no-files-found: error

  macos:
    name: ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            runner: macos-15
          - rid: osx-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Fetch pinned upstream source
        run: python scripts/fetch_upstream.py
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: .upstream/Filee/global.json
      # Ad-hoc signed like upstream's own macOS packages (no Apple Developer ID, no notarization).
      - name: Build package
        run: python scripts/build_package.py --rid ${{ matrix.rid }}
      - name: Smoke test
        run: python scripts/smoke_test.py dist/filee-cli-*-${{ matrix.rid }}.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.rid }}
          path: |
            dist/filee-cli-*-${{ matrix.rid }}.tar.gz
            dist/filee-cli-*-${{ matrix.rid }}.files.txt
          if-no-files-found: error

  windows:
    name: win-x64
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Fetch pinned upstream source
        run: python scripts/fetch_upstream.py
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: .upstream/Filee/global.json
      - name: Build package
        run: python scripts/build_package.py --rid win-x64
      - name: Smoke test
        shell: pwsh
        run: python scripts/smoke_test.py (Get-ChildItem dist/filee-cli-*-win-x64.zip).FullName
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-win-x64
          path: |
            dist/filee-cli-*-win-x64.zip
            dist/filee-cli-*-win-x64.files.txt
          if-no-files-found: error
