name: Release

# Publishes a GitHub release from a tag v<UPSTREAM version>-<revision>, e.g. v2.0.0-2 for UPSTREAM tag=v2.0.0,
# revision=2. Pushing such a tag starts it (`git tag -a v2.0.0-2 -m ... && git push origin v2.0.0-2`), or run it on an
# existing tag by hand: `gh workflow run release.yml --ref v2.0.0-2`. The tag must match the UPSTREAM file
# (`filee-build release` checks it) and point at a commit on main. All five packages are built and smoke-tested first;
# the release job only runs when all of it succeeds. A tag that already has a release is left alone (so
# `filee-build local --publish`, which pushes the tag and creates the release itself, does not collide with this).
# The Homebrew tap and the Scoop bucket (their own repositories) poll the latest release and update themselves, so this
# workflow needs no token for them.

on:
  push:
    tags: ['v[0-9]*-[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: release exists?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      # `filee-build local --publish` pushes the tag and then creates the release; wait a little for it before deciding.
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then sleep 60; fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG already has a release; nothing to do"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: ${{ needs.gate.outputs.exists == 'false' }}
    uses: ./.github/workflows/build.yml

  release:
    needs: [gate, build]
    if: ${{ needs.gate.outputs.exists == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write        # create the release and upload assets with the job's GITHUB_TOKEN
      id-token: write        # OIDC token for the Sigstore signing certificate (attestation)
      attestations: write    # store the attestation
      artifact-metadata: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Must run on a tag, which must be on main
        run: |
          [ "$GITHUB_REF_TYPE" = tag ] || { echo "::error::run this workflow on a tag (--ref vX.Y.Z-N)"; exit 1; }
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::$TAG is not on main"; exit 1; }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*'
          path: assets
          merge-multiple: true

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: SHA256SUMS and release notes
        run: |
          mkdir -p listings && mv assets/*.files.txt listings/
          go run ./cmd/filee-build release assets --tag "$TAG" --slug "$GITHUB_REPOSITORY"
          cat assets/SHA256SUMS
          (cd assets && sha256sum --check SHA256SUMS)

      # Signed build provenance through GitHub's OIDC token and Sigstore. GitHub supports it for public repositories
      # (and Enterprise Cloud); the public-good Sigstore log would also record the name of a private repository,
      # so the step runs only while this repository is public.
      - name: Attest build provenance
        if: ${{ github.event.repository.private == false }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: assets/SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          # `filee-build local --publish` may have finished this release while the packages were built here.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::$TAG got a release in the meantime; not creating another"
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "filee-cli ${TAG#v}" \
            --notes-file assets/RELEASE_NOTES.md --draft \
            assets/filee-cli-*.tar.gz assets/filee-cli-*.zip assets/filee-cli-*.part* assets/SHA256SUMS
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: file-listings
          path: listings/
