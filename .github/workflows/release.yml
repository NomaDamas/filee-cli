name: Release

# Publishes a GitHub release from a tag v<UPSTREAM version>-<revision>, e.g. v1.12.0-1 for UPSTREAM tag=v1.12.0,
# revision=1. Run it on the tag: `gh workflow run release.yml --ref v1.12.0-1`. The tag must match the UPSTREAM file
# (`filee-build release` checks it) and point at a commit on main. All five packages are built and smoke-tested first,
# and the Corresponding Source of the bundled engines is fetched; the release job only runs when all of it succeeds.
#
# Manual, not on tag push, because `filee-build local --publish` pushes the tag and creates the release from this
# computer while the repository is private. Use this workflow once GitHub Actions can run for the repository.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write        # create the release and upload assets with the job's GITHUB_TOKEN
      id-token: write        # OIDC token for the Sigstore signing certificate (attestation)
      attestations: write    # store the attestation
      artifact-metadata: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Must run on a tag, which must be on main
        run: |
          [ "$GITHUB_REF_TYPE" = tag ] || { echo "::error::run this workflow on a tag (--ref vX.Y.Z-N)"; exit 1; }
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::$TAG is not on main"; exit 1; }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*'
          path: assets
          merge-multiple: true

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: SHA256SUMS and release notes
        run: |
          mkdir -p listings && mv assets/*.files.txt listings/
          go run ./cmd/filee-build release assets --tag "$TAG" --slug "$GITHUB_REPOSITORY"
          cat assets/SHA256SUMS
          (cd assets && sha256sum --check SHA256SUMS)

      # Signed build provenance through GitHub's OIDC token and Sigstore. GitHub supports it for public repositories
      # (and Enterprise Cloud); the public-good Sigstore log would also record the name of a private repository,
      # so the step runs only once this repository is public.
      - name: Attest build provenance
        if: ${{ github.event.repository.private == false }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: assets/SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "filee-cli ${TAG#v}" \
            --notes-file assets/RELEASE_NOTES.md --draft \
            assets/filee-cli-*.tar.gz assets/filee-cli-*.zip assets/filee-cli-*.part* assets/SHA256SUMS
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: file-listings
          path: listings/
