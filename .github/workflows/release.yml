name: Release

# Publishes a GitHub release when a tag v<UPSTREAM version>-<revision> is pushed, e.g. v1.12.0-1 for UPSTREAM
# tag=v1.12.0, revision=1. The tag must match the UPSTREAM file (prepare_release.py checks it) and must point at a
# commit on main. All five packages are built and smoke-tested first; the release job only runs when all five pass.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write        # create the release and upload assets with the job's GITHUB_TOKEN
      id-token: write        # OIDC token for the Sigstore signing certificate (attestation)
      attestations: write    # store the attestation
      artifact-metadata: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag must be on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::$TAG is not on main"; exit 1; }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: assets
          merge-multiple: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: SHA256SUMS and release notes
        run: |
          mkdir -p listings && mv assets/*.files.txt listings/
          python scripts/prepare_release.py assets --tag "$TAG" --slug "$GITHUB_REPOSITORY"
          cat assets/SHA256SUMS
          (cd assets && sha256sum --check SHA256SUMS)

      # Signed build provenance through GitHub's OIDC token and Sigstore. GitHub supports it for public repositories
      # (and Enterprise Cloud); the public-good Sigstore log would also record the name of a private repository,
      # so the step runs only once this repository is public.
      - name: Attest build provenance
        if: ${{ github.event.repository.private == false }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: assets/SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "filee-cli ${TAG#v}" \
            --notes-file assets/RELEASE_NOTES.md --draft \
            assets/filee-cli-*.tar.gz assets/filee-cli-*.zip assets/SHA256SUMS
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: file-listings
          path: listings/
