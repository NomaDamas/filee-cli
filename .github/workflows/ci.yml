name: CI

# Builds the five packages on GitHub's runners (free for a public repository). The smoke test downloads FFmpeg, Pandoc and
# (macOS, Windows) Ghostscript from their vendors, so it runs on pull requests and when started by hand, not on every push.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
