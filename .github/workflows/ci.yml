name: CI

# Builds the five packages on GitHub's runners (free for a public repository). Every build downloads about 1.5 GB of
# engines and takes tens of minutes, so it runs on pull requests and when started by hand, not on every push.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
